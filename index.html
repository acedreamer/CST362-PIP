<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CST362 Python PYQ Analyzer</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500&family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME ENGINE
           ========================================================================== */
        :root {
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --spring-easing: cubic-bezier(0.175, 0.885, 0.32, 1.15);
            --fast-easing: cubic-bezier(0.4, 0, 0.2, 1);

            /* LIGHT THEME (Default) */
            --bg: #FBFBFA; --bg-dark: #F2F1EE; --bg-card: #FFFFFF; --bg-card-open: #F9F9F8;
            --accent: #0F172A; --accent-light: #F1F5F9; --accent-mid: #E2E8F0; --accent-muted: #64748B;
            --text: #1A1C1E; --text-light: #2F3437; --muted: #64748B;
            --border: #EAEAEA; --border-strong: #D1D5DB;
            --or-bg: #F8FAFC; --memorise-bg: #F1F5F9; --memorise-border: #E2E8F0;
            --practice-bg: #ECFDF5; --practice-border: #D1FAE5;
            --prep-bg: #F8FAFC; --prep-border: #E2E8F0; --chip-bg: #F1F5F9;
        }

        /* HIGH-END DARK MODE */
        [data-theme="dark"] {
            --bg: #09090B; --bg-dark: #121217; --bg-card: #18181B; --bg-card-open: #212124;
            --text: #FAFAFA; --text-light: #A1A1AA; --muted: #71717A;
            --border: #27272A; --border-strong: #3F3F46;
            --or-bg: #111113; --memorise-bg: #221D18; --memorise-border: #3F3429;
            --practice-bg: #12221D; --practice-border: #1E3F35;
            --prep-bg: #121217; --prep-border: #27272A; --chip-bg: #27272A;
            --accent: #E4E4E7; --accent-light: rgba(255, 255, 255, 0.05);
        }

        /* ==========================================================================
           2. GLOBAL RESET & BASE STYLES
           ========================================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s var(--ease-out), color 0.3s var(--ease-out), border-color 0.3s var(--ease-out); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

        body {
            font-family: 'Lato', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        h1 { font-weight: 700; font-size: 32px; letter-spacing: -0.5px; margin-bottom: 8px; }
        h2 { font-weight: 600; font-size: 20px; display: flex; align-items: center; gap: 12px; }

        .app-wrapper { display: flex; width: 100%; height: 100vh; max-width: 1200px; margin: 0 auto; }

        /* Sidebar */
        .sidebar {
            width: 280px; height: 100vh; overflow-y: auto; flex-shrink: 0;
            background-color: var(--bg-dark); border-right: 1px solid var(--border);
            padding: 32px 24px; display: flex; flex-direction: column;
        }

        .eyebrow { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 16px; }
        .nav-list { list-style: none; margin-top: 32px; flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .nav-item {
            padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
            color: var(--text-light); border-left: 2px solid transparent; display: flex; justify-content: space-between; align-items: center;
        }
        .nav-item:hover { background-color: rgba(255,255,255,0.05); transform: translateX(4px); }
        .nav-item.active { border-left: 2px solid var(--accent); background-color: var(--accent-light); color: var(--text); font-weight: 700; }
        .nav-progress { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

        /* Theme Footer Controls */
        .theme-footer { margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-strong); transition: .4s var(--ease-out); border-radius: 34px;
        }
        .slider-icon {
            position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: var(--bg-card); transition: .4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider .slider-icon { transform: translateX(24px); }

        /* Main Content */
        .main-content { flex: 1; height: 100vh; overflow-y: auto; padding: 40px 48px 120px; scroll-behavior: smooth; }
        .content-container { max-width: 860px; margin: 0 auto; }

        /* Components */
        .module-section { margin-bottom: 64px; }
        .module-header { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }

        .or-strategy-box { background-color: var(--or-bg); border: 1px solid var(--accent-muted); border-radius: 8px; padding: 16px 20px; margin-bottom: 24px; border-left-width: 4px; }
        .or-strategy-box h4 { font-size: 13px; text-transform: uppercase; color: var(--text); margin-bottom: 4px; }
        .or-strategy-box p { font-size: 13px; line-height: 1.6; color: var(--muted); }

        .accordion {
            background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 12px; border-left: 3px solid transparent; overflow: hidden;
        }
        .accordion.open { background-color: var(--bg-card-open); border-left: 3px solid var(--accent); margin-top: 16px; margin-bottom: 24px; }
        .accordion-header { padding: 16px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .topic-name { font-size: 15px; font-weight: 600; }

        .badge { font-family: 'DM Mono', monospace; font-size: 10px; padding: 4px 8px; border-radius: 4px; }
        .badge-sure { background-color: var(--accent-light); border: 1px solid var(--accent-mid); color: var(--accent); }
        .badge-high { background-color: var(--or-bg); border: 1px solid var(--accent-muted); }

        .checkbox-wrapper { position: relative; width: 24px; height: 24px; cursor: pointer; z-index: 2; }
        .checkbox-input { position: absolute; opacity: 0; }
        .checkbox-custom {
            height: 24px; width: 24px; border: 2px solid var(--border-strong); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; transition: 0.3s var(--spring-easing);
        }
        .checkbox-input:checked ~ .checkbox-custom { background-color: var(--accent); border-color: var(--accent); }
        .check-icon { color: white; width: 14px; height: 14px; opacity: 0; transition: 0.3s; }
        .checkbox-input:checked ~ .checkbox-custom .check-icon { opacity: 1; }

        .accordion.checked .topic-name { text-decoration: line-through; color: var(--muted); }

        .accordion-content { display: none; padding: 0 20px 20px 60px; }
        .accordion.open .accordion-content { display: block; }
        
        .prep-block { border-left: 3px solid var(--accent); padding: 12px 16px; background: linear-gradient(to right, var(--prep-bg), transparent); margin-bottom: 16px; }
        .prep-block p { font-size: 13px; line-height: 1.6; color: var(--text-light); }
        
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .action-card { padding: 16px; border-radius: 8px; font-size: 13px; border-left: 3px solid; }
        .card-memorise { background: var(--memorise-bg); border-color: var(--accent-muted); }
        .card-practice { background: var(--practice-bg); border-color: var(--accent); }
        .action-card h5 { font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; margin-bottom: 8px; opacity: 0.8; }

        @media (max-width: 768px) {
            .app-wrapper { flex-direction: column; }
            .sidebar { display: none; }
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <aside class="sidebar">
            <div>
                <span class="eyebrow">PYQ Analyzer</span>
                <h1>CST362</h1>
                <p style="font-size: 13px; color: var(--muted);">Programming in Python</p>
            </div>

            <ul class="nav-list" id="desktopNav"></ul>

            <div class="theme-footer">
                <span style="font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase;">Mode</span>
                <label class="switch">
                    <input type="checkbox" id="themeInput" onchange="toggleTheme()">
                    <span class="slider"><span class="slider-icon">☀️</span></span>
                </label>
            </div>
        </aside>

        <main class="main-content" id="mainContent">
            <div class="content-container" id="modulesContainer"></div>
        </main>
    </div>

    <script>
        const EXAM_DATA = [
            {
                id: "module-1",
                title: "Module 1",
                strategy: "Highly predictable. Master Armstrong, Prime, and Pattern logic for 14 marks.",
                topics: [
                    { id: "m1t1", name: "Number Logic", prob: "SURE SHOT", badges: ["4/4", "Code"], prep: "Armstrong, Prime, Factorial algorithms.", memorise: "Armstrong: sum of digit**3. Prime: sqrt(n) check.", practice: "Factorial [May '24], Prime [Jun '22]." }
                ]
            },
            {
                id: "module-4",
                title: "Module 4",
                strategy: "Exception handling is the easiest 7 marks. Memorise the try-except logic.",
                topics: [
                    { id: "m4t1", name: "Exception Handling", prob: "SURE SHOT", badges: ["4/4", "Theory"], prep: "Try/Except/Finally lifecycle.", memorise: "Finally runs regardless of error.", practice: "Write divide function handling ZeroDivisionError." }
                ]
            }
        ];

        function toggleTheme() {
            const isDark = document.getElementById('themeInput').checked;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.querySelector('.slider-icon').textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('pythonTheme', isDark ? 'dark' : 'light');
        }

        function init() {
            const saved = localStorage.getItem('pythonTheme') || 'light';
            const isDark = saved === 'dark';
            document.getElementById('themeInput').checked = isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.querySelector('.slider-icon').textContent = isDark ? '🌙' : '☀️';

            const nav = document.getElementById('desktopNav');
            const container = document.getElementById('modulesContainer');
            
            EXAM_DATA.forEach(mod => {
                nav.innerHTML += `<li class="nav-item">${mod.title} <span class="nav-progress">0/${mod.topics.length}</span></li>`;
                
                let modHTML = `<section id="${mod.id}" class="module-section">
                    <div class="module-header"><h2>${mod.title}</h2></div>
                    <div class="or-strategy-box"><h4>Exam Strategy</h4><p>${mod.strategy}</p></div>`;
                
                mod.topics.forEach(t => {
                    modHTML += `
                    <div class="accordion" id="acc-${t.id}">
                        <div class="accordion-header" onclick="document.getElementById('acc-${t.id}').classList.toggle('open')">
                            <div style="display:flex; align-items:center; gap:16px;">
                                <div class="checkbox-wrapper" onclick="event.stopPropagation(); this.closest('.accordion').classList.toggle('checked')">
                                    <input type="checkbox" class="checkbox-input">
                                    <div class="checkbox-custom"><span class="check-icon">✓</span></div>
                                </div>
                                <span class="topic-name">${t.name}</span>
                            </div>
                            <span class="badge badge-sure">${t.prob}</span>
                        </div>
                        <div class="accordion-content">
                            <div class="prep-block"><p>${t.prep}</p></div>
                            <div class="card-grid">
                                <div class="action-card card-memorise"><h5>Memorise</h5><p>${t.memorise}</p></div>
                                <div class="action-card card-practice"><h5>Practice</h5><p>${t.practice}</p></div>
                            </div>
                        </div>
                    </div>`;
                });
                container.innerHTML += modHTML + `</section>`;
            });
        }

        window.onload = init;
    </script>
</body>
</html>
